<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simandou Spares Management</title>
<style>
:root{--bg:#f0f2f5;--sf:#fff;--sf2:#f8f9fb;--bd:#d0d5dd;--bd2:#a0aab8;--ac:#b45309;--ac2:#92400e;--tx:#0f1117;--tx2:#2d3748;--tx3:#5a6478;--sh:0 1px 3px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,serif;font-size:14px}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
#loading .sp{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-family:'Courier New',monospace;font-size:13px;color:var(--tx3);letter-spacing:1px}
.topbar{background:var(--sf);border-bottom:2px solid var(--bd);padding:0 18px;display:flex;align-items:center;gap:10px;height:58px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.logo{font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--ac)}
.logo span{color:var(--tx3)}
.sep{width:1px;height:28px;background:var(--bd);flex-shrink:0}
.nav{display:flex;flex-direction:column;flex:1;overflow:hidden}
.nav-row{display:flex;gap:3px;overflow-x:auto;padding:2px 0}
.nav-row::-webkit-scrollbar{height:0}
.tab{padding:5px 12px;font-size:11.5px;font-family:'Courier New',monospace;cursor:pointer;border-radius:5px;color:var(--tx2);background:none;border:1.5px solid transparent;white-space:nowrap;font-weight:600}
.tab:hover{background:var(--sf2);border-color:var(--bd)}
.tab.active{border-color:currentColor;font-weight:700}
.t-da.active{color:#b45309;background:#fef3c7;border-color:#b45309}
.t-mm.active{color:#374151;background:#f3f4f6;border-color:#6b7280}
.t-ab.active{color:#003d6b;background:#e0f0ff;border-color:#0066b3}
.t-tk.active{color:#7a2800;background:#fff0e8;border-color:#cc4400}
.t-pr.active{color:#7f1d1d;background:#fee2e2;border-color:#b91c1c}
.t-lg.active{color:#1e3a8a;background:#dbeafe;border-color:#1d4ed8}
.t-al.active{color:#374151;background:#f3f4f6;border-color:#6b7280}
.t-co.active{color:#1e3a8a;background:#dbeafe;border-color:#1d4ed8}
.t-ci.active{color:#4c1d95;background:#ede9fe;border-color:#6d28d9}
.t-op.active{color:#064e3b;background:#d1fae5;border-color:#047857}
.t-st.active{color:#78350f;background:#fef3c7;border-color:#b45309}
.topbtns{display:flex;gap:8px;flex-shrink:0}
.btn{padding:7px 14px;background:var(--sf2);color:var(--tx2);border:1.5px solid var(--bd);border-radius:6px;font-size:12px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600}
.btn:hover{background:var(--bd)}
.b-pr{background:#065f46;color:#fff;border-color:#065f46}
.b-pr:hover{background:#047857}
.b-ad{background:#b45309;color:#fff;border-color:#b45309}
.b-ad:hover{background:#92400e}
.content{padding:16px 18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:18px}
.metric{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:12px;box-shadow:var(--sh)}
.metric .val{font-size:26px;font-weight:700;font-family:'Courier New',monospace}
.metric .lbl{font-size:10px;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;margin-top:3px;font-family:'Courier New',monospace}
.metric.hi{border-color:#b45309}.metric.hi .val{color:#b45309}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.panel{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:14px;box-shadow:var(--sh)}
.ptitle{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);font-family:'Courier New',monospace;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.bar-lbl{width:100px;color:var(--tx2);flex-shrink:0;font-size:13px}
.bar-track{flex:1;background:var(--bg);border-radius:3px;height:7px;overflow:hidden;border:1px solid var(--bd)}
.bar-fill{height:100%;border-radius:3px}
.bar-num{width:36px;text-align:right;color:var(--tx3);font-size:12px;font-family:'Courier New',monospace}
.oembox{border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.oemname{font-size:18px;font-weight:700;font-family:'Courier New',monospace}
.oemstats{display:flex;gap:14px}
.oemstat{text-align:center;cursor:pointer}
.oemstat .sv{font-size:20px;font-weight:700;font-family:'Courier New',monospace}
.oemstat .sl{font-size:10px;text-transform:uppercase;font-family:'Courier New',monospace;opacity:.8}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.srch{flex:1;min-width:180px;position:relative}
.srch input{width:100%;padding:9px 12px 9px 32px;background:var(--sf);border:1.5px solid var(--bd);border-radius:7px;color:var(--tx);font-family:Georgia,serif;font-size:14px}
.srch input:focus{outline:none;border-color:#b45309}
.srch input::placeholder{color:var(--tx3)}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:14px;pointer-events:none}
.fsel{padding:9px 12px;background:var(--sf);border:1.5px solid var(--bd);border-radius:7px;color:var(--tx2);font-family:Georgia,serif;font-size:14px}
.rc{font-size:13px;color:var(--tx3);font-family:'Courier New',monospace}
.twrap{overflow-x:auto;border:1.5px solid var(--bd);border-radius:10px;background:var(--sf);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:1100px}
th{text-align:left;padding:9px 7px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);background:var(--sf2);border-bottom:2px solid var(--bd);white-space:nowrap;font-weight:700;cursor:pointer;user-select:none;font-family:'Courier New',monospace}
th:hover{background:var(--bd)}
th.asc::after{content:' ▲'}th.desc::after{content:' ▼'}
td{padding:8px 7px;border-bottom:1px solid var(--bd);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:hover td{background:#fefce8}
tr:nth-child(even) td{background:var(--sf2)}
tr:nth-child(even):hover td{background:#fefce8}
tr:last-child td{border-bottom:none}
.qz{color:#b91c1c!important;font-weight:700!important;background:#fee2e2!important}
.ql{color:#b45309!important;font-weight:700!important}
.b{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;font-family:'Courier New',monospace}
.bCO{background:#dbeafe;color:#1e3a8a;border:1.5px solid #93c5fd}
.bCI{background:#ede9fe;color:#4c1d95;border:1.5px solid #c4b5fd}
.b2Y{background:#d1fae5;color:#064e3b;border:1.5px solid #6ee7b7}
.bST{background:#fef3c7;color:#78350f;border:1.5px solid #fcd34d}
.bY{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;font-size:11px;padding:1px 5px}
.bN{background:#f1f5f9;color:var(--tx3);border:1.5px solid var(--bd);font-size:11px;padding:1px 5px}
.bAB{background:#e0f0ff;color:#003d6b;border:1.5px solid #93c5fd;font-size:10px}
.bTK{background:#fff0e8;color:#7a2800;border:1.5px solid #fdba74;font-size:10px}
.abtn{padding:3px 7px;font-size:11px;border-radius:4px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600;border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx2)}
.abtn:hover{background:var(--bd)}
.abtn.del:hover{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.abtn.iss{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.abtn.iss:hover{background:#1d4ed8;color:#fff}
.empty{text-align:center;padding:48px;color:var(--tx3)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px;color:var(--tx3)}
.pbtn{padding:6px 14px;background:var(--sf);border:1.5px solid var(--bd);border-radius:6px;color:var(--tx2);cursor:pointer;font-family:'Courier New',monospace;font-size:12px}
.pbtn:hover:not(:disabled){background:var(--bd)}
.pbtn:disabled{opacity:.4;cursor:default}
.pinfo{flex:1;text-align:center;font-family:'Courier New',monospace}
.pcard{background:var(--sf);border:1.5px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.pcard:hover{background:#fffbeb}
.pdesc{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pint{font-size:11px;color:#7c2d12;background:#fff7ed;border:1.5px solid #fb923c;border-radius:4px;padding:2px 7px;min-width:120px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;font-family:'Courier New',monospace}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.ov.show{display:flex}
.modal{background:var(--sf);border:1.5px solid var(--bd2);border-radius:12px;padding:22px;width:620px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal.nw{width:440px}
.mh{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#b45309;margin-bottom:16px;font-family:'Courier New',monospace}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi.fw{grid-column:1/-1}
.fi label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);font-family:'Courier New',monospace;font-weight:700}
.fi input,.fi select,.fi textarea{padding:8px 10px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:7px;color:var(--tx);font-family:Georgia,serif;font-size:14px}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:#b45309}
.fi textarea{resize:vertical;min-height:48px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.mc{padding:8px 14px;background:var(--sf2);border:1.5px solid var(--bd);color:var(--tx2);border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.ms{padding:8px 20px;background:#b45309;color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;font-weight:700}
.mi{padding:8px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;font-weight:700}
.si2{background:var(--sf2);border:1.5px solid var(--bd);border-radius:8px;padding:11px 13px;margin-bottom:13px;display:flex;align-items:center;gap:14px}
.sv2{font-size:22px;font-weight:700;font-family:'Courier New',monospace}
.sl2{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-family:'Courier New',monospace}
.iw{color:#b91c1c;font-size:12px;font-family:'Courier New',monospace;margin-top:5px;min-height:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><p>LOADING SPARES REGISTER…</p></div>
<div class="topbar" style="display:none" id="topbar">
  <div class="logo">SIMANDOU <span>// SPARES</span></div>
  <div class="sep"></div>
  <div class="nav">
    <div class="nav-row">
      <button class="tab t-da active" onclick="sv('dash')">Dashboard</button>
      <button class="tab t-mm" onclick="sv('mm')">Material Master</button>
      <button class="tab t-ab" onclick="sv('ABB')">ABB</button>
      <button class="tab t-tk" onclick="sv('TAKRAF')">TAKRAF</button>
      <button class="tab t-pr" onclick="sv('pres')">Preservation</button>
      <button class="tab t-lg" onclick="sv('log')">Issue Log <span id="nl"></span></button>
    </div>
    <div class="nav-row" id="cr" style="display:none">
      <button class="tab t-al active" onclick="sc2('ALL')">All <span id="ca"></span></button>
      <button class="tab t-co" onclick="sc2('COMM')">COMM <span id="cc"></span></button>
      <button class="tab t-ci" onclick="sc2('CI')">CI <span id="ci2"></span></button>
      <button class="tab t-op" onclick="sc2('2YR')">2YR OPS <span id="cy"></span></button>
      <button class="tab t-st" onclick="sc2('ST')">Spec Tools <span id="cs"></span></button>
    </div>
  </div>
  <div class="topbtns">
    <button class="btn b-pr" onclick="doPrint()">☓ Print</button>
    <button class="btn" onclick="doCSV()">↓ CSV</button>
    <button class="btn b-ad" onclick="oAdd()">+ Add</button>
  </div>
</div>
<div class="content" id="app" style="display:none"></div>

<div class="ov" id="oe"><div class="modal">
  <div class="mh" id="mh">ADD RECORD</div>
  <div class="fg">
    <div class="fi"><label>Tag</label><input id="ft"></div>
    <div class="fi"><label>Part No.</label><input id="fp"></div>
    <div class="fi fw"><label>Description</label><input id="fd"></div>
    <div class="fi"><label>Commodity</label><select id="fc"><option value="COMM">COMM</option><option value="CI">CI</option><option value="2YR">2YR OPS</option><option value="ST">ST</option></select></div>
    <div class="fi"><label>OEM/Supplier</label><input id="fo"></div>
    <div class="fi"><label>System</label><input id="fsy"></div>
    <div class="fi"><label>Sub System</label><input id="fsu"></div>
    <div class="fi"><label>Shipment Ref</label><input id="fsh"></div>
    <div class="fi"><label>Packing List</label><input id="fpl"></div>
    <div class="fi"><label>Qty in Stock</label><input id="fq" type="number" min="0"></div>
    <div class="fi"><label>Unit</label><input id="fu"></div>
    <div class="fi"><label>Bin Location</label><input id="fb"></div>
    <div class="fi"><label>Unit Cost (£)</label><input id="fco" type="number" step="0.01"></div>
    <div class="fi"><label>Lead Time (days)</label><input id="fl" type="number"></div>
    <div class="fi"><label>Country/Location</label><input id="flc"></div>
    <div class="fi"><label>Preservation?</label><select id="fpr"><option value="No">No</option><option value="Yes">Yes</option></select></div>
    <div class="fi"><label>Pres. Interval</label><input id="fpi"></div>
    <div class="fi fw"><label>Notes</label><textarea id="fn" rows="2"></textarea></div>
  </div>
  <div class="ma"><button class="mc" onclick="cM()">Cancel</button><button class="ms" onclick="sRec()">Save</button></div>
</div></div>
<div class="ov" id="oi"><div class="modal nw">
  <div class="mh">☓ Issue Material</div>
  <div class="si2">
    <div><div class="sl2">Item</div><div style="font-size:13px;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="id2"></div><div style="font-size:11px;color:var(--tx3);font-family:'Courier New',monospace" id="ip2"></div></div>
    <div style="margin-left:auto;text-align:right"><div class="sl2">In Stock</div><div class="sv2" id="is2"></div><div style="font-size:11px;color:var(--tx3);font-family:'Courier New',monospace" id="ib2"></div></div>
  </div>
  <div class="fg" style="grid-template-columns:1fr 1fr;gap:11px">
    <div class="fi"><label>Qty to Issue</label><input id="iq" type="number" min="1" oninput="chkI()"><div class="iw" id="iw"></div></div>
    <div class="fi"><label>Issue Date</label><input id="idt" type="date"></div>
    <div class="fi"><label>Issued To</label><input id="it"></div>
    <div class="fi"><label>Work Order</label><input id="iw2"></div>
    <div class="fi fw"><label>Remarks</label><textarea id="ir" rows="2"></textarea></div>
  </div>
  <div class="ma"><button class="mc" onclick="cM()">Cancel</button><button class="mi" onclick="cfI()">Confirm Issue</button></div>
</div></div>

<script>
// Fetch data asynchronously - non-blocking
fetch('data.js')
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  })
  .then(function(txt){
    window.SPARES_DATA=JSON.parse(txt.replace('window.SPARES_DATA=','').slice(0,-1));
    init();
  })
  .catch(function(e){
    document.getElementById('loading').innerHTML='<div style="color:#b91c1c;font-family:monospace;font-size:14px">Error: '+e.message+'<br>Please refresh the page.</div>';
  });

var db,nid,iL=[],view='dash',comm='ALL',q='',oem='',sc=null,sd=1,pg=0,ei=null,ii=null;
var PS=100;
var CL={COMM:'#2563eb',CI:'#7c3aed','2YR':'#059669',ST:'#d97706'};
var CN={COMM:'Commissioning',CI:'Capital Insurance','2YR':'2-Year Ops',ST:'Special Tools'};
var BC={COMM:'bCO',CI:'bCI','2YR':'b2Y',ST:'bST'};

function init(){
  if(!window.SPARES_DATA){setTimeout(init,50);return;}
  db=window.SPARES_DATA.map(function(r,i){return Object.assign({},r,{_id:i,system:r.system||'',subsystem:r.subsystem||'',bin:r.bin||'',shipment_ref:r.shipment_ref||'',packing_list:r.packing_list||'',qty_stock:r.qty_stock!==undefined?r.qty_stock:(r.qty?parseInt(r.qty)||0:0)});});
  nid=db.length;
  document.getElementById('loading').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('app').style.display='block';
  render();
}

function sv(v){
  view=v;q='';oem='';pg=0;
  document.querySelectorAll('.t-da,.t-mm,.t-ab,.t-tk,.t-pr,.t-lg').forEach(function(e){e.classList.remove('active');});
  var m={dash:'.t-da',mm:'.t-mm',ABB:'.t-ab',TAKRAF:'.t-tk',pres:'.t-pr',log:'.t-lg'};
  document.querySelector(m[v]).classList.add('active');
  var sh=v==='mm'||v==='ABB'||v==='TAKRAF';
  document.getElementById('cr').style.display=sh?'flex':'none';
  if(sh){comm='ALL';uCT();}
  render();
}
function sc2(c){comm=c;pg=0;q='';uCT();render();}
function uCT(){
  document.querySelectorAll('.t-al,.t-co,.t-ci,.t-op,.t-st').forEach(function(e){e.classList.remove('active');});
  var m={ALL:'.t-al',COMM:'.t-co',CI:'.t-ci','2YR':'.t-op',ST:'.t-st'};
  document.querySelector(m[comm]).classList.add('active');
  var src=gVS();var bC={ALL:src.length,COMM:0,CI:0,'2YR':0,ST:0};
  src.forEach(function(r){bC[r.commodity]=(bC[r.commodity]||0)+1;});
  var ids={ALL:'ca',COMM:'cc',CI:'ci2','2YR':'cy',ST:'cs'};
  Object.keys(ids).forEach(function(k){var e=document.getElementById(ids[k]);if(e)e.textContent='('+bC[k]+')';});
}
function uLC(){var e=document.getElementById('nl');if(e)e.textContent='('+iL.length+')';}
function gVS(){
  if(view==='ABB')return db.filter(function(r){return r.oem==='ABB';});
  if(view==='TAKRAF')return db.filter(function(r){return r.oem==='TAKRAF';});
  return db;
}
function gF(src){
  var ql=q.toLowerCase();
  return src.filter(function(r){
    if(oem&&(r.oem||r.manufacturer||'')!==oem)return false;
    if(!ql)return true;
    return(r.description+r.pn+r.tag+r.system+r.subsystem+r.bin+r.shipment_ref+r.packing_list).toLowerCase().indexOf(ql)>=0;
  });
}
function gS(arr){
  if(!sc)return arr;
  return arr.slice().sort(function(a,b){var av=a[sc]||'',bv=b[sc]||'';if(!isNaN(parseFloat(av))&&!isNaN(parseFloat(bv)))return(parseFloat(av)-parseFloat(bv))*sd;return av.toString().localeCompare(bv.toString())*sd;});
}
function srt(c){if(sc===c)sd=-sd;else{sc=c;sd=1;}render();}

var _t=null;
function dS(v){q=v;clearTimeout(_t);_t=setTimeout(function(){pg=0;var aid=document.activeElement?document.activeElement.id:null;var as=document.activeElement?document.activeElement.selectionStart:null;render();if(aid){var e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(as,as);}catch(x){}}}},200);}

function render(){
  var e=document.getElementById('app');
  if(view==='dash')rDash(e);
  else if(view==='pres')rPres(e);
  else if(view==='log')rLog(e);
  else rTab(e);
  uLC();
  if(view==='mm'||view==='ABB'||view==='TAKRAF')uCT();
  var ms=document.getElementById('ms');if(ms&&ms.value!==q)ms.value=q;
}

function rDash(e){
  var bC={COMM:0,CI:0,'2YR':0,ST:0};var aC={COMM:0,CI:0,'2YR':0};var tC={COMM:0,CI:0,'2YR':0,ST:0};
  var aV=0,pres=0,zs=0;
  db.forEach(function(r){
    bC[r.commodity]=(bC[r.commodity]||0)+1;
    if(r.oem==='ABB'){aC[r.commodity]=(aC[r.commodity]||0)+1;if(r.cost)aV+=parseFloat(r.cost)*(r.qty_stock||0);}
    if(r.oem==='TAKRAF')tC[r.commodity]=(tC[r.commodity]||0)+1;

  var r={_id:ei!==null?db[ei]._id:nid++,tag:document.getElementById('ft').value.trim(),pn:document.getElementById('fp').value.trim(),description:document.getElementById('fd').value.trim(),commodity:document.getElementById('fc').value,oem:o,manufacturer:o,system:document.getElementById('fsy').value.trim(),subsystem:document.getElementById('fsu').value.trim(),shipment_ref:document.getElementById('fsh').value.trim(),packing_list:document.getElementById('fpl').value.trim(),qty:String(nq),qty_stock:nq,unit:document.getElementById('fu').value.trim(),bin:document.getElementById('fb').value.trim(),cost:document.getElementById('fco').value,leadtime:document.getElementById('fl').value,location:document.getElementById('flc').value.trim(),preservation:document.getElementById('fpr').value,presinterval:document.getElementById('fpi').value.trim(),notes:document.getElementById('fn').value.trim(),added:new Date().toISOString().split('T')[0]};
  if(!r.description&&!r.pn){alert('Enter a description or part number.');return;}
  if(ei!==null)db[ei]=r;else db.push(r);

function dRec(i){if(!confirm('Delete?'))return;db.splice(i,1);render();}
function cM(){document.getElementById('oe').classList.remove('show');document.getElementById('oi').classList.remove('show');ei=null;ii=null;}
document.getElementById('oe').addEventListener('click',function(e){if(e.target===this)cM();});
document.getElementById('oi').addEventListener('click',function(e){if(e.target===this)cM();});

function doPrint(){
  var pw=window.open('','_blank');
  var secs=[];
  if(view==='dash'||view==='mm'){
    [['ABB','COMM'],['ABB','CI'],['ABB','2YR'],['TAKRAF','COMM'],['TAKRAF','CI'],['TAKRAF','2YR'],['TAKRAF','ST']].forEach(function(x){
      secs.push({label:x[0]+' — '+CN[x[1]],rows:db.filter(function(r){return r.oem===x[0]&&r.commodity===x[1];}),col:CL[x[1]]||'#333'});
    });
  } else if(view==='ABB'||view==='TAKRAF'){
    var s=comm==='ALL'?db.filter(function(r){return r.oem===view;}):db.filter(function(r){return r.oem===view&&r.commodity===comm;});
    secs.push({label:view+' — '+(comm==='ALL'?'All':CN[comm]),rows:s,col:view==='ABB'?'#0066b3':'#cc4400'});
  } else if(view==='pres'){
    secs.push({label:'Preservation Register',rows:db.filter(function(r){return r.preservation==='Yes';}),col:'#b91c1c',pres:true});
  } else if(view==='log'){
    secs.push({label:'Issue Log',rows:[...iL].reverse(),col:'#1d4ed8',log:true});
  }
  var body=secs.filter(function(s){return s.rows.length;}).map(function(s,i){
    var t='';
    if(s.log){
      t='<table><thead><tr><th>Date</th><th>OEM</th><th>Tag</th><th>Part No.</th><th>Description</th><th>Bin</th><th>Issued</th><th>Before</th><th>After</th><th>Issued To</th><th>WO</th><th>Remarks</th></tr></thead><tbody>'
        +s.rows.map(function(l,j){return '<tr'+(j%2?' style="background:#f7f7f7"':'')+'>'+[l.ts,l.oem,'<b>'+l.tag+'</b>',l.pn||'-',l.desc,l.bin||'-','-'+l.qty,l.qB,l.qA,l.to||'-',l.wo||'-',l.rem||'-'].map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
    } else if(s.pres){
      t='<table><thead><tr><th>OEM</th><th>Comm.</th><th>Tag</th><th>Description</th><th>System</th><th>Sub System</th><th>Bin</th><th>Qty</th><th>Pres. Doc</th></tr></thead><tbody>'
        +s.rows.map(function(r,j){return '<tr'+(j%2?' style="background:#f7f7f7"':'')+'>'+[r.oem||'',r.commodity,r.tag||'',r.description||'',r.system||'-',r.subsystem||'-',r.bin||'-',r.qty_stock||0,r.presinterval||'TBD'].map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
    } else {
      t='<table><thead><tr><th>Shipment Ref</th><th>Packing List</th><th>Tag</th><th>Part No.</th><th>Description</th><th>System</th><th>Sub System</th><th>Bin</th><th>Qty</th><th>UOM</th><th>Supplier</th><th>Cost</th><th>Pres.</th></tr></thead><tbody>'
        +s.rows.map(function(r,j){var c=r.cost?'£'+parseFloat(r.cost).toLocaleString(undefined,{maximumFractionDigits:0}):'-';return '<tr'+(j%2?' style="background:#f7f7f7"':'')+'>'+[r.shipment_ref||'-',r.packing_list||'-',r.tag||'',r.pn||'-',r.description||'',r.system||'-',r.subsystem||'-',r.bin||'-',r.qty_stock||0,r.unit||'',r.oem||r.manufacturer||'',c,r.preservation].map(function(v){return '<td>'+v+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
    }
    return (i>0?'<div style="page-break-before:always"></div>':'')+'<div style="background:'+s.col+';color:#fff;padding:5pt 10pt;margin-bottom:6pt;font-size:10pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact">'+s.label+' · '+s.rows.length+(s.log?' transactions':' items')+'</div>'+t;
  }).join('');
  var d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  pw.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><style>@page{size:A4 landscape;margin:10mm 8mm 8mm 8mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:8.5pt;color:#000}.hdr{background:#1a1a2e;color:#fff;padding:6pt 10pt;margin-bottom:8pt;display:flex;align-items:center;justify-content:space-between;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ftr{border-top:0.5pt solid #ccc;margin-top:6pt;padding-top:3pt;font-size:6pt;color:#888;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-bottom:4pt}th{background:#1a1a2e;color:#fff;padding:3pt 4pt;text-align:left;border:0.5pt solid #555;-webkit-print-color-adjust:exact;print-color-adjust:exact}td{padding:2.5pt 4pt;border:0.5pt solid #ccc}thead{display:table-header-group}tr{page-break-inside:avoid}</style></head><body>'
    +'<div class="hdr"><div><div style="font-size:14pt;font-weight:700;letter-spacing:2pt">RIO TINTO</div><div style="font-size:7pt;color:#aaa">ICS DEPARTMENT | SIMANDOU PROJECT</div></div><div style="text-align:center;font-size:11pt;font-weight:700">SPARES REGISTER</div><div style="text-align:right;font-size:7pt;color:#aaa">'+d+'</div></div>'
    +body+'<div class="ftr"><span>CONFIDENTIAL — RIO TINTO ICS DEPARTMENT</span><span>Uncontrolled when printed</span></div></body></html>');
  pw.document.close();pw.onload=function(){pw.focus();pw.print();};
}
function doCSV(){
  if(view==='log'){eLog();return;}
  var src=view==='pres'?db.filter(function(r){return r.preservation==='Yes';}):view==='ABB'?(comm==='ALL'?db.filter(function(r){return r.oem==='ABB';}):db.filter(function(r){return r.oem==='ABB'&&r.commodity===comm;})):view==='TAKRAF'?(comm==='ALL'?db.filter(function(r){return r.oem==='TAKRAF';}):db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity===comm;})):(comm==='ALL'?db:db.filter(function(r){return r.commodity===comm;}));
  var h=['Shipment Ref','Packing List','Tag','Part No','Description','Commodity','OEM','System','Sub System','Bin','Qty','Unit','Cost','Location','Preservation','Pres Doc','Notes'];
  var rows=src.map(function(r){return [r.shipment_ref,r.packing_list,r.tag,r.pn,r.description,r.commodity,r.oem||r.manufacturer,r.system,r.subsystem,r.bin,r.qty_stock,r.unit,r.cost,r.location,r.preservation,r.presinterval,r.notes].map(function(v){return '"'+((v===undefined||v===null?'':v).toString().replace(/"/g,'""'))+'"';}).join(',');});
  dl([h.join(',')].concat(rows).join('
'),'simandou_'+view+'_'+new Date().toISOString().split('T')[0]+'.csv');
}
function eLog(){
  var h=['Date','OEM','Tag','Part No','Description','Bin','Issued','Before','After','Issued To','WO','Remarks'];
  var rows=iL.map(function(l){return [l.ts,l.oem,l.tag,l.pn,l.desc,l.bin,l.qty,l.qB,l.qA,l.to,l.wo,l.rem].map(function(v){return '"'+((v===undefined||v===null?'':v).toString().replace(/"/g,'""'))+'"';}).join(',');});
  dl([h.join(',')].concat(rows).join('
'),'simandou_issue_log_'+new Date().toISOString().split('T')[0]+'.csv');
}
function dl(csv,name){var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=name;a.click();}
init();
