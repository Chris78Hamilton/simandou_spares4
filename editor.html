<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simandou – Spares Management System</title>
<style>
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f8f9fb;
  --border:#d0d5dd;--border2:#a0aab8;
  --accent:#b45309;--accent2:#92400e;
  --text:#0f1117;--text2:#2d3748;--text3:#5a6478;
  --comm:#1d4ed8;--comm-bg:#dbeafe;--comm-t:#1e3a8a;
  --ci:#6d28d9;--ci-bg:#ede9fe;--ci-t:#4c1d95;
  --ops:#047857;--ops-bg:#d1fae5;--ops-t:#064e3b;
  --st:#b45309;--st-bg:#fef3c7;--st-t:#78350f;
  --pres:#b91c1c;--pres-bg:#fee2e2;--pres-t:#7f1d1d;
  --abb:#0066b3;--abb-bg:#e0f0ff;--abb-t:#003d6b;
  --tak:#cc4400;--tak-bg:#fff0e8;--tak-t:#7a2800;
  --shadow:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.5}
.topbar{background:var(--surface);border-bottom:2px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:10px;height:58px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.logo{font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--accent);white-space:nowrap}
.logo span{color:var(--text3)}
.sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.nav{display:flex;flex-direction:column;flex:1;overflow:hidden}
.nav-row{display:flex;gap:3px;overflow-x:auto;padding:3px 0 2px}
.nav-row::-webkit-scrollbar{height:0}
.nav-grp{display:flex;align-items:center;gap:3px;padding-right:10px;border-right:1px solid var(--border);margin-right:6px;flex-shrink:0}
.nav-grp-lbl{font-family:'Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding-right:5px;white-space:nowrap}
.tab{padding:5px 12px;font-size:11.5px;font-family:'Courier New',monospace;letter-spacing:.4px;cursor:pointer;border-radius:5px;color:var(--text2);background:none;border:1.5px solid transparent;white-space:nowrap;transition:all .15s;font-weight:600}
.tab:hover{background:var(--surface2);border-color:var(--border)}
.tab.active{border-color:currentColor;font-weight:700}
.tab-dash.active{color:var(--accent);background:#fef3c7;border-color:var(--accent)}
.tab-mm.active{color:#374151;background:#f3f4f6;border-color:#6b7280}
.tab-abb.active{color:var(--abb-t);background:var(--abb-bg);border-color:var(--abb)}
.tab-tak.active{color:var(--tak-t);background:var(--tak-bg);border-color:var(--tak)}
.tab-pres.active{color:var(--pres-t);background:var(--pres-bg);border-color:var(--pres)}
.tab-log.active{color:#1e3a8a;background:#dbeafe;border-color:#1d4ed8}
.tab-comm.active{color:var(--comm-t);background:var(--comm-bg);border-color:var(--comm)}
.tab-ci.active{color:var(--ci-t);background:var(--ci-bg);border-color:var(--ci)}
.tab-ops.active{color:var(--ops-t);background:var(--ops-bg);border-color:var(--ops)}
.tab-st.active{color:var(--st-t);background:var(--st-bg);border-color:var(--st)}
.tab-all.active{color:#374151;background:#f3f4f6;border-color:#6b7280}
.topbtns{display:flex;gap:8px;flex-shrink:0}
.btn{padding:7px 14px;background:var(--surface2);color:var(--text2);border:1.5px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600;transition:all .15s}
.btn:hover{background:var(--border);color:var(--text)}
.btn-add{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-add:hover{background:var(--accent2)}
.btn-print{background:#065f46;color:#fff;border-color:#065f46}
.btn-print:hover{background:#047857}
.content{padding:16px 18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:18px}
.metric{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.metric .val{font-size:26px;font-weight:700;color:var(--text);font-family:'Courier New',monospace}
.metric .lbl{font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-top:3px;font-family:'Courier New',monospace}
.metric.hi{border-color:var(--accent)}.metric.hi .val{color:var(--accent)}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.panel-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-family:'Courier New',monospace;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}
.bar-row:hover .bar-label{color:var(--text)}
.bar-label{width:105px;color:var(--text2);flex-shrink:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--bg);border-radius:3px;height:7px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:3px}
.bar-num{width:36px;text-align:right;color:var(--text3);font-size:12px;font-family:'Courier New',monospace}
.oem-banner{border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.oem-name{font-size:18px;font-weight:700;font-family:'Courier New',monospace;letter-spacing:1px}
.oem-stats{display:flex;gap:14px;flex-wrap:wrap}
.oem-stat{text-align:center}
.oem-stat .sv{font-size:20px;font-weight:700;font-family:'Courier New',monospace}
.oem-stat .sl{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:'Courier New',monospace;opacity:.8}
/* COLUMN FILTERS */
.cfbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;box-shadow:var(--shadow);align-items:flex-end}
.cfw{display:flex;flex-direction:column;gap:3px;min-width:90px;flex:1;max-width:160px}
.cfl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-family:'Courier New',monospace;font-weight:700}
.cfs{padding:5px 6px;background:var(--surface2);border:1.5px solid var(--border);border-radius:5px;color:var(--text2);font-family:'Courier New',monospace;font-size:11px;cursor:pointer;width:100%}
.cfs:focus{outline:none;border-color:var(--accent)}
.cfs.on{border-color:var(--accent);background:#fef3c7;color:var(--text);font-weight:700}
.cf-clear{padding:5px 12px;background:#fee2e2;border:1.5px solid #fca5a5;border-radius:5px;color:#b91c1c;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;white-space:nowrap;font-weight:700}
.cf-clear:hover{background:#b91c1c;color:#fff}
.cf-count{font-size:11px;color:var(--accent);font-family:'Courier New',monospace;font-weight:700;white-space:nowrap}
/* TOOLBAR */
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.srch{flex:1;min-width:200px;position:relative}
.srch input{width:100%;padding:9px 12px 9px 34px;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:Georgia,serif;font-size:14px}
.srch input::placeholder{color:var(--text3)}
.srch input:focus{outline:none;border-color:var(--accent)}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.fsel{padding:9px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:7px;color:var(--text2);font-family:Georgia,serif;font-size:14px;cursor:pointer}
.rcount{font-size:13px;color:var(--text3);white-space:nowrap;font-family:'Courier New',monospace}
/* TABLE */
.twrap{overflow-x:auto;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:1200px}
th{text-align:left;padding:10px 8px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);background:var(--surface2);border-bottom:2px solid var(--border);white-space:nowrap;font-weight:700;cursor:pointer;user-select:none;font-family:'Courier New',monospace}
th:hover{color:var(--text);background:var(--border)}
th.asc::after{content:' ▲'}th.desc::after{content:' ▼'}
td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-size:13px}
tr:hover td{background:#fefce8}
tr:nth-child(even) td{background:var(--surface2)}
tr:nth-child(even):hover td{background:#fefce8}
tr:last-child td{border-bottom:none}
.qty-low{color:#b45309!important;font-weight:700!important}
.qty-zero{color:#b91c1c!important;font-weight:700!important;background:#fee2e2!important}
.b{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.4px;font-family:'Courier New',monospace}
.bCOMM{background:var(--comm-bg);color:var(--comm-t);border:1.5px solid #93c5fd}
.bCI{background:var(--ci-bg);color:var(--ci-t);border:1.5px solid #c4b5fd}
.b2YR{background:var(--ops-bg);color:var(--ops-t);border:1.5px solid #6ee7b7}
.bST{background:var(--st-bg);color:var(--st-t);border:1.5px solid #fcd34d}
.bY{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;font-size:11px;padding:2px 6px}
.bN{background:#f1f5f9;color:var(--text3);border:1.5px solid var(--border);font-size:11px;padding:2px 6px}
.bABB{background:var(--abb-bg);color:var(--abb-t);border:1.5px solid #93c5fd;font-size:10px}
.bTAK{background:var(--tak-bg);color:var(--tak-t);border:1.5px solid #fdba74;font-size:10px}
.abtn{padding:4px 8px;font-size:11px;border-radius:5px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2)}
.abtn:hover{background:var(--border);color:var(--text)}
.abtn.del:hover{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.abtn.issue{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.abtn.issue:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.empty{text-align:center;padding:56px 20px;color:var(--text3);font-size:15px}
.pager{display:flex;align-items:center;gap:10px;padding:12px 0 4px;font-size:13px;color:var(--text3)}
.pbtn{padding:6px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-family:'Courier New',monospace;font-size:12px}
.pbtn:hover:not(:disabled){background:var(--border);color:var(--text)}
.pbtn:disabled{opacity:.4;cursor:default}
.pinfo{flex:1;text-align:center;font-family:'Courier New',monospace}
.pcard{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--border2);background:#fffbeb}
.ptag{font-size:12px;color:var(--text3);min-width:65px;flex-shrink:0;font-family:'Courier New',monospace}
.pdesc{flex:1;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pint{font-size:11px;color:#7c2d12;background:#fff7ed;border:1.5px solid #fb923c;border-radius:5px;padding:2px 8px;min-width:130px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;font-family:'Courier New',monospace}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.ov.show{display:flex}
.modal{background:var(--surface);border:1.5px solid var(--border2);border-radius:12px;padding:24px;width:640px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.narrow{width:460px}
.modal h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-family:'Courier New',monospace}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);font-family:'Courier New',monospace;font-weight:700}
.fg input,.fg select,.fg textarea{padding:9px 10px;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:Georgia,serif;font-size:14px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:52px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.mcancel{padding:9px 16px;background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.msave{padding:9px 22px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;font-weight:700}
.msave:hover{background:var(--accent2)}
.missue{padding:9px 22px;background:#1d4ed8;color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;font-weight:700}
.missue:hover{background:#1e3a8a}
.stock-info{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:16px}
.stock-val{font-size:22px;font-weight:700;font-family:'Courier New',monospace}
.stock-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:'Courier New',monospace}
.issue-warn{color:#b91c1c;font-size:12px;font-family:'Courier New',monospace;margin-top:6px;min-height:18px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
<style media="print">
@page{size:A4 landscape;margin:10mm 8mm 8mm 8mm}
body{background:#fff!important;color:#000!important;font-family:Arial,Helvetica,sans-serif;font-size:8.5pt}
.topbar,.toolbar,.pager,.topbtns,.mact,.abtn,.ov,.metrics,.dash-row,.pcard,.empty,.oem-banner,.cfbar{display:none!important}
.content{padding:0!important}
.twrap{border:none!important;border-radius:0!important;overflow:visible!important}
table{min-width:unset!important;width:100%!important;border-collapse:collapse!important;font-size:7.5pt!important;table-layout:fixed!important}
th{background:#1a1a2e!important;color:#fff!important;font-size:7pt!important;padding:3pt 4pt!important;border:0.5pt solid #888!important;white-space:normal!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
td{padding:2.5pt 4pt!important;border:0.5pt solid #ccc!important;color:#000!important;white-space:normal!important;background:#fff!important;overflow:visible!important}
tr:nth-child(even) td{background:#f7f7f7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
tr:hover td{background:unset!important}
thead{display:table-header-group}tr{page-break-inside:avoid}
.b{background:none!important;border:0.5pt solid #999!important;color:#000!important;padding:0 3pt!important;font-size:7pt!important}
.bY{color:#c0392b!important;border-color:#c0392b!important;font-weight:700}
th.asc::after,th.desc::after{content:''!important}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">SIMANDOU <span>// SPARES</span></div>
  <div class="sep"></div>
  <div class="nav">
    <div class="nav-row">
      <div class="nav-grp">
        <span class="nav-grp-lbl">Views</span>
        <button class="tab tab-dash active" onclick="setView('dash')">Dashboard</button>
        <button class="tab tab-mm" onclick="setView('mm')">Material Master</button>
        <button class="tab tab-abb" onclick="setView('ABB')">ABB</button>
        <button class="tab tab-tak" onclick="setView('TAKRAF')">TAKRAF</button>
        <button class="tab tab-pres" onclick="setView('pres')">Preservation</button>
        <button class="tab tab-log" onclick="setView('log')">Issue Log <span id="n-log"></span></button>
      </div>
    </div>
    <div class="nav-row" id="comm-row" style="display:none">
      <div class="nav-grp">
        <span class="nav-grp-lbl">Filter</span>
        <button class="tab tab-all active" onclick="setComm('ALL')">All <span id="cf-ALL"></span></button>
        <button class="tab tab-comm" onclick="setComm('COMM')">COMM <span id="cf-COMM"></span></button>
        <button class="tab tab-ci" onclick="setComm('CI')">CI <span id="cf-CI"></span></button>
        <button class="tab tab-ops" onclick="setComm('2YR')">2YR OPS <span id="cf-2YR"></span></button>
        <button class="tab tab-st" onclick="setComm('ST')">Spec Tools <span id="cf-ST"></span></button>
      </div>
    </div>
  </div>
  <div class="topbtns">
    <button class="btn btn-print" onclick="doPrint()">&#9113; Print</button>
    <button class="btn" onclick="exportCSV()">&#8595; CSV</button>
    <button class="btn btn-add" onclick="openAdd()">+ Add</button>
  </div>
</div>
<div class="content" id="app"></div>

<div class="ov" id="ov-edit">
<div class="modal">
  <h2 id="mtitle">ADD RECORD</h2>
  <div class="fgrid">
    <div class="fg"><label>Tag / Item No.</label><input id="f-tag" placeholder="e.g. TK-1.1"></div>
    <div class="fg"><label>Part Number</label><input id="f-pn" placeholder="OEM part number"></div>
    <div class="fg full"><label>Description</label><input id="f-desc"></div>
    <div class="fg"><label>Commodity</label>
      <select id="f-comm">
        <option value="COMM">COMM – Commissioning</option>
        <option value="CI">CI – Capital Insurance</option>
        <option value="2YR">2YR OPS – 2-Year Operational</option>
        <option value="ST">ST – Special Tools</option>
      </select>
    </div>
    <div class="fg"><label>OEM / Supplier</label><input id="f-oem"></div>
    <div class="fg"><label>System</label><input id="f-sys"></div>
    <div class="fg"><label>Sub System</label><input id="f-sub"></div>
    <div class="fg"><label>Shipment Ref</label><input id="f-ship" placeholder="e.g. SHP-2026-001"></div>
    <div class="fg"><label>Packing List Ref</label><input id="f-pack" placeholder="e.g. PL-2026-001"></div>
    <div class="fg"><label>Qty in Stock</label><input id="f-qty" type="number" min="0"></div>
    <div class="fg"><label>Unit</label><input id="f-unit" placeholder="pcs / EA / SET"></div>
    <div class="fg"><label>Bin Location</label><input id="f-bin"></div>
    <div class="fg"><label>Unit Cost (£)</label><input id="f-cost" type="number" step="0.01"></div>
    <div class="fg"><label>Lead Time (days)</label><input id="f-lt" type="number"></div>
    <div class="fg"><label>Country / Location</label><input id="f-loc"></div>
    <div class="fg"><label>Preservation?</label>
      <select id="f-pres"><option value="No">No</option><option value="Yes">Yes</option></select>
    </div>
    <div class="fg"><label>Pres. Interval / Doc</label><input id="f-pi"></div>
    <div class="fg full"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>
  </div>
  <div class="mact">
    <button class="mcancel" onclick="closeModals()">Cancel</button>
    <button class="msave" onclick="saveRec()">Save Record</button>
  </div>
</div>
</div>
<div class="ov" id="ov-issue">
<div class="modal narrow">
  <h2>&#9113; Issue Material</h2>
  <div class="stock-info">
    <div>
      <div class="stock-lbl">Item</div>
      <div style="font-size:13px;font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="iss-desc"></div>
      <div style="font-size:11px;color:var(--text3);font-family:'Courier New',monospace" id="iss-pn"></div>
    </div>
    <div style="margin-left:auto;text-align:right">
      <div class="stock-lbl">Qty in Stock</div>
      <div class="stock-val" id="iss-stock"></div>
      <div style="font-size:11px;color:var(--text3);font-family:'Courier New',monospace" id="iss-bin"></div>
    </div>
  </div>
  <div class="fgrid" style="grid-template-columns:1fr 1fr;gap:12px">
    <div class="fg"><label>Qty to Issue</label>
      <input id="iss-qty" type="number" min="1" placeholder="0" oninput="checkIssue()">
      <div class="issue-warn" id="iss-warn"></div>
    </div>
    <div class="fg"><label>Issue Date</label><input id="iss-date" type="date"></div>
    <div class="fg"><label>Issued To</label><input id="iss-to"></div>
    <div class="fg"><label>Work Order / WBS</label><input id="iss-wo"></div>
    <div class="fg full"><label>Remarks</label><textarea id="iss-rem" rows="2"></textarea></div>
  </div>
  <div class="mact">

function setView(v){
  view=v;q='';oemF='';pg=0;
  colF={shipment_ref:'',packing_list:'',commodity:'',oem:'',system:'',subsystem:'',bin:'',preservation:'',unit:''};
  document.querySelectorAll('.tab-dash,.tab-mm,.tab-abb,.tab-tak,.tab-pres,.tab-log').forEach(el=>el.classList.remove('active'));
  const m={dash:'.tab-dash',mm:'.tab-mm',ABB:'.tab-abb',TAKRAF:'.tab-tak',pres:'.tab-pres',log:'.tab-log'};
  document.querySelector(m[v]).classList.add('active');
  const showComm=v==='mm'||v==='ABB'||v==='TAKRAF';
  document.getElementById('comm-row').style.display=showComm?'flex':'none';
  if(showComm){commF='ALL';updateCommTabs();}
  render();
}
function setComm(c){
  commF=c;pg=0;q='';

  updateCommTabs();render();
}

function clearAllFilters(){
  colF={shipment_ref:'',packing_list:'',commodity:'',oem:'',system:'',subsystem:'',bin:'',preservation:'',unit:''};
  q='';oemF='';pg=0;

}
function activeFC(){return Object.values(colF).filter(v=>v!=='').length+(q?1:0);}

function updateCommTabs(){
  document.querySelectorAll('.tab-all,.tab-comm,.tab-ci,.tab-ops,.tab-st').forEach(el=>el.classList.remove('active'));
  const m={'ALL':'.tab-all','COMM':'.tab-comm','CI':'.tab-ci','2YR':'.tab-ops','ST':'.tab-st'};
  document.querySelector(m[commF]).classList.add('active');
  const src=getViewSrc();
  const byC={ALL:src.length,COMM:0,CI:0,'2YR':0,ST:0};
  src.forEach(r=>byC[r.commodity]=(byC[r.commodity]||0)+1);
  ['ALL','COMM','CI','2YR','ST'].forEach(k=>{const el=document.getElementById('cf-'+k);if(el)el.textContent='('+byC[k]+')';});
}
function updateLogCount(){const el=document.getElementById('n-log');if(el)el.textContent='('+issLog.length+')';}
function getViewSrc(){
  if(view==='ABB')return db.filter(r=>r.oem==='ABB');
  if(view==='TAKRAF')return db.filter(r=>r.oem==='TAKRAF');
  return db;
}
function getFiltered(src){
  const ql=q.toLowerCase();
  return src.filter(r=>{
    if(oemF&&(r.oem||r.manufacturer||'')!==oemF)return false;
    if(colF.shipment_ref&&r.shipment_ref!==colF.shipment_ref)return false;
    if(colF.packing_list&&r.packing_list!==colF.packing_list)return false;
    if(colF.commodity&&r.commodity!==colF.commodity)return false;
    if(colF.oem&&(r.oem||r.manufacturer||'')!==colF.oem)return false;
    if(colF.system&&r.system!==colF.system)return false;
    if(colF.subsystem&&r.subsystem!==colF.subsystem)return false;
    if(colF.bin&&r.bin!==colF.bin)return false;
    if(colF.preservation&&r.preservation!==colF.preservation)return false;
    if(colF.unit&&r.unit!==colF.unit)return false;
    if(!ql)return true;
    return(r.description+r.pn+r.tag+r.system+r.subsystem+r.bin+r.shipment_ref+r.packing_list+r.notes).toLowerCase().includes(ql);
  });
}
function getSorted(arr){
  if(!sc)return arr;
  return[...arr].sort((a,b)=>{
    let av=a[sc]||'',bv=b[sc]||'';
    if(!isNaN(parseFloat(av))&&!isNaN(parseFloat(bv)))return(parseFloat(av)-parseFloat(bv))*sd;
    return av.toString().localeCompare(bv.toString())*sd;
  });
}
function srt(col){if(sc===col)sd=-sd;else{sc=col;sd=1;}render();}

// Search debounce
let _st=null;
function debSearch(val){
  q=val;clearTimeout(_st);
  _st=setTimeout(()=>{
    pg=0;
    const aid=document.activeElement?document.activeElement.id:null;
    const asel=document.activeElement?document.activeElement.selectionStart:null;
    render();
    if(aid){const el=document.getElementById(aid);if(el){el.focus();try{el.setSelectionRange(asel,asel);}catch(e){}}}
  },150);
}

function render(){
  const el=document.getElementById('app');
  if(view==='dash')renderDash(el);
  else if(view==='pres')renderPres(el);
  else if(view==='log')renderLog(el);
  else renderTab(el);
  updateLogCount();
  if(view==='mm'||view==='ABB'||view==='TAKRAF')updateCommTabs();
  const ms=document.getElementById('main-search');if(ms&&ms.value!==q)ms.value=q;
}

function buildCFBar(srcAll){
  const cols=[
    {col:'shipment_ref',label:'Shipment Ref'},
    {col:'packing_list',label:'Packing List'},
    {col:'commodity',label:'Commodity'},
    {col:'oem',label:'OEM'},
    {col:'system',label:'System'},
    {col:'subsystem',label:'Sub System'},
    {col:'bin',label:'Bin'},
    {col:'preservation',label:'Preservation'},
    {col:'unit',label:'UOM'}
  ];
  const parts=cols.map(({col,label})=>{
    const vals=[...new Set(srcAll.map(r=>col==='oem'?(r.oem||r.manufacturer||''):(r[col]||'')))].filter(v=>v!=='').sort();
    if(!vals.length)return '';
    const active=colF[col]!=='';
    const opts=vals.map(v=>'<option value="'+v+'"'+(colF[col]===v?' selected':'')+'>'+v.substring(0,20)+'</option>').join('');
    return '<div class="cfw"><div class="cfl">'+label+'</div><select class="cfs'+(active?' on':'')+'" onchange="setColF(''+col+'',this.value)"><option value="">All</option>'+opts+'</select></div>';
  }).filter(Boolean);
  const ac=activeFC();
  const clear=ac>0?'<button class="cf-clear" onclick="clearAllFilters()">&#10005; Clear ('+ac+')</button>':'';
  return '<div class="cfbar">'+parts.join('')+clear+'</div>';
}

function buildTable(rows,showOEM){
  if(!rows.length)return '<div class="empty">— No records found —</div>';
  function statBadge(r){
    var m=(r.notes||'').match(/Status:\s*([^|]+)/);if(!m)return '';
    var s=m[1].trim(),sl=s.toLowerCase();
    if(sl.indexOf('ship')>=0)return '<span style="color:#065f46;background:#d1fae5;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #6ee7b7">'+s.substring(0,13)+'</span> ';
    if(sl.indexOf('ready')>=0)return '<span style="color:#78350f;background:#fef3c7;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #fcd34d">'+s.substring(0,13)+'</span> ';
    if(sl.indexOf('deliver')>=0)return '<span style="color:#1e3a8a;background:#dbeafe;padding:1px 5px;border-radius:4px;font-size:11px;border:1px solid #93c5fd">'+s.substring(0,13)+'</span> ';
    return '';
  }
  function ss(col){return sc===col?(sd===1?' asc':' desc'):'';}
  var cg=showOEM
    ?'<col style="width:46px"><col style="width:88px"><col style="width:88px"><col style="width:56px"><col style="width:52px"><col style="width:95px"><col style="width:140px"><col style="width:70px"><col style="width:65px"><col style="width:65px"><col style="width:44px"><col style="width:32px"><col style="width:58px"><col style="width:54px"><col style="width:40px"><col style="width:85px">'

  var hdr='<thead><tr>'+(showOEM?'<th onclick="srt('oem')" class="'+ss('oem')+'">OEM</th>':'')+
    '<th onclick="srt('shipment_ref')" class="'+ss('shipment_ref')+'">Shipment Ref</th>'+
    '<th onclick="srt('packing_list')" class="'+ss('packing_list')+'">Packing List</th>'+
    '<th onclick="srt('commodity')" class="'+ss('commodity')+'">Comm.</th>'+
    '<th onclick="srt('tag')" class="'+ss('tag')+'">Tag</th>'+
    '<th onclick="srt('pn')" class="'+ss('pn')+'">Part No.</th>'+
    '<th onclick="srt('description')" class="'+ss('description')+'">Description</th>'+
    '<th onclick="srt('system')" class="'+ss('system')+'">System</th>'+
    '<th onclick="srt('subsystem')" class="'+ss('subsystem')+'">Sub System</th>'+
    '<th onclick="srt('bin')" class="'+ss('bin')+'">Bin</th>'+
    '<th onclick="srt('qty_stock')" class="'+ss('qty_stock')+'">Qty</th>'+
    '<th>UOM</th>'+
    '<th onclick="srt('cost')" class="'+ss('cost')+'">Cost</th>'+
    '<th>Pres.</th>'+
    '<th>Status</th>'+
    '<th>Actions</th>'+
    '</tr></thead>';
  var body=rows.map(function(r){
    var idx=db.findIndex(function(x){return x._id===r._id;});
    var qs=parseInt(r.qty_stock)||0;
    var qCls=qs===0?'qty-zero':qs<=2?'qty-low':'';
    var cost=r.cost?'£'+parseFloat(r.cost).toLocaleString(undefined,{maximumFractionDigits:0}):'&mdash;';
    var oem=r.oem||r.manufacturer||'';
    var actns=statBadge(r)+'<button class="abtn issue" onclick="openIssue('+idx+')" title="Issue">&#9113;</button> <button class="abtn" onclick="editRec('+idx+')">Edit</button> <button class="abtn del" onclick="delRec('+idx+')">Del</button>';
    return '<tr>'+(showOEM?'<td><span class="b '+(oem==='ABB'?'bABB':'bTAK')+'">'+oem+'</span></td>':'')+
      '<td style="font-size:12px;font-family:'Courier New',monospace;color:#1e3a8a;font-weight:600">'+( r.shipment_ref||'&mdash;')+'</td>'+
      '<td style="font-size:12px;font-family:'Courier New',monospace;color:#4c1d95;font-weight:600">'+(r.packing_list||'&mdash;')+'</td>'+
      '<td><span class="b b'+r.commodity+'">'+r.commodity+'</span></td>'+
      '<td style="font-size:12px;font-family:'Courier New',monospace;font-weight:600">'+(r.tag||'')+'</td>'+
      '<td style="font-size:12px;font-family:'Courier New',monospace;color:#7c2d12;font-weight:600" title="'+(r.pn||'')+'">'+(r.pn||'&mdash;')+'</td>'+
      '<td style="font-weight:500" title="'+(r.description||'').replace(/"/g,'')+'">'+(r.description||'')+'</td>'+
      '<td style="font-size:12px;color:var(--text2)" title="'+(r.system||'')+'">'+(r.system||'&mdash;')+'</td>'+
      '<td style="font-size:12px;color:var(--text3)" title="'+(r.subsystem||'')+'">'+(r.subsystem||'&mdash;')+'</td>'+
      '<td style="font-size:12px;font-family:'Courier New',monospace;color:#065f46;font-weight:600">'+(r.bin||'&mdash;')+'</td>'+
      '<td class="'+qCls+'" style="text-align:right;font-family:'Courier New',monospace;font-weight:700;font-size:14px">'+qs+'</td>'+
      '<td style="font-size:12px;color:var(--text3)">'+(r.unit||'')+'</td>'+

      '<td>'+(r.preservation==='Yes'?'<span class="b bY">YES</span>':'<span class="b bN">NO</span>')+'</td>'+
      '<td>'+statBadge(r)+'</td>'+

      '</tr>';
  }).join('');
  return '<div class="twrap"><table><colgroup>'+cg+'</colgroup>'+hdr+'<tbody>'+body+'</tbody></table></div>';
}

function openIssue(idx){
  issIdx=idx;var r=db[idx];
  document.getElementById('iss-desc').textContent=r.description||'';
  document.getElementById('iss-pn').textContent=(r.oem||r.manufacturer||'')+' · '+(r.pn||'No part number');
  var qs=parseInt(r.qty_stock)||0;
  document.getElementById('iss-stock').textContent=qs+' '+(r.unit||'');
  document.getElementById('iss-stock').style.color=qs===0?'#b91c1c':qs<=2?'#d97706':'#065f46';
  document.getElementById('iss-bin').textContent=r.bin?'Bin: '+r.bin:'No bin assigned';
  document.getElementById('iss-qty').value='';
  document.getElementById('iss-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('iss-to').value='';document.getElementById('iss-wo').value='';
  document.getElementById('iss-rem').value='';document.getElementById('iss-warn').textContent='';
  document.getElementById('ov-issue').classList.add('show');
}
function checkIssue(){
  var r=db[issIdx];var qs=parseInt(r.qty_stock)||0;
  var want=parseInt(document.getElementById('iss-qty').value)||0;
  var w=document.getElementById('iss-warn');
  if(want>qs)w.textContent='⚠ Only '+qs+' in stock';
  else if(want<=0)w.textContent='⚠ Enter qty > 0';
  else if(qs-want===0)w.textContent='⚠ This will zero out stock';
  else w.textContent='';
}
function confirmIssue(){
  var r=db[issIdx];var qs=parseInt(r.qty_stock)||0;
  var want=parseInt(document.getElementById('iss-qty').value)||0;
  if(want<=0){alert('Enter a quantity to issue.');return;}
  if(want>qs){alert('Cannot issue '+want+' — only '+qs+' in stock.');return;}
  var ts=document.getElementById('iss-date').value+' '+new Date().toTimeString().substring(0,5);
  db[issIdx].qty_stock=qs-want;
  issLog.push({ts:ts,oem:r.oem||r.manufacturer||'',tag:r.tag,pn:r.pn,desc:r.description,bin:r.bin,
    qtyIssued:want,qtyBefore:qs,qtyAfter:qs-want,
    issuedTo:document.getElementById('iss-to').value.trim(),
    wo:document.getElementById('iss-wo').value.trim(),
    remark:document.getElementById('iss-rem').value.trim()});
  closeModals();render();
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;right:24px;background:#065f46;color:#fff;padding:14px 20px;border-radius:8px;font-family:"Courier New",monospace;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2)';
  t.textContent='✓ Issued '+want+' × '+r.description.substring(0,30)+' — Stock: '+(qs-want)+' '+(r.unit||'');
  document.body.appendChild(t);setTimeout(function(){t.remove();},4000);
}

function saveRec(){
  var o=document.getElementById('f-oem').value.trim();
  var nq=parseInt(document.getElementById('f-qty').value)||0;
  var r={_id:ei!==null?db[ei]._id:nid++,
    tag:document.getElementById('f-tag').value.trim(),pn:document.getElementById('f-pn').value.trim(),
    description:document.getElementById('f-desc').value.trim(),commodity:document.getElementById('f-comm').value,
    oem:o,manufacturer:o,system:document.getElementById('f-sys').value.trim(),
    subsystem:document.getElementById('f-sub').value.trim(),bin:document.getElementById('f-bin').value.trim(),
    shipment_ref:document.getElementById('f-ship').value.trim(),packing_list:document.getElementById('f-pack').value.trim(),
    qty:String(nq),qty_stock:nq,unit:document.getElementById('f-unit').value.trim(),
    cost:document.getElementById('f-cost').value,leadtime:document.getElementById('f-lt').value,
    location:document.getElementById('f-loc').value.trim(),preservation:document.getElementById('f-pres').value,
    presinterval:document.getElementById('f-pi').value.trim(),notes:document.getElementById('f-notes').value.trim(),
    added:new Date().toISOString().split('T')[0]};
  if(!r.description&&!r.pn){alert('Enter at least a description or part number.');return;}
  if(ei!==null)db[ei]=r;else db.push(r);
  closeModals();render();
}
function delRec(i){if(!confirm('Delete this record?'))return;db.splice(i,1);render();}
function closeModals(){
  document.getElementById('ov-edit').classList.remove('show');
  document.getElementById('ov-issue').classList.remove('show');
  ei=null;issIdx=null;
}

function doPrint(){
  var titles={dash:'ALL COMMODITIES — MATERIAL MASTER',mm:'MATERIAL MASTER — ALL RECORDS',ABB:'ABB — SPARES TABULATION',TAKRAF:'TAKRAF — SPARES TABULATION',pres:'PRESERVATION REGISTER',log:'ISSUE LOG'};
  var pw=window.open('','_blank','width=1200,height=800');
  pw.document.write(buildPrintHTML(titles[view]||view));
  pw.document.close();pw.onload=function(){pw.focus();pw.print();};
}
function buildPrintHTML(title){
  var dated=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  var cc={'COMM':'#1d4ed8','CI':'#6d28d9','2YR':'#047857','ST':'#b45309','pres':'#b91c1c','log':'#1d4ed8'};
  var sections=[];
  if(view==='dash'||view==='mm'){
    sections=[
      {label:'ABB — Commissioning Spares',rows:db.filter(function(r){return r.oem==='ABB'&&r.commodity==='COMM';}),col:'#1d4ed8'},
      {label:'ABB — Capital Insurance Spares',rows:db.filter(function(r){return r.oem==='ABB'&&r.commodity==='CI';}),col:'#6d28d9'},
      {label:'ABB — 2-Year Operational Spares',rows:db.filter(function(r){return r.oem==='ABB'&&r.commodity==='2YR';}),col:'#047857'},
      {label:'TAKRAF — Commissioning Spares',rows:db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity==='COMM';}),col:'#1d4ed8'},
      {label:'TAKRAF — Capital Insurance Spares',rows:db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity==='CI';}),col:'#6d28d9'},
      {label:'TAKRAF — 2-Year Operational Spares',rows:db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity==='2YR';}),col:'#047857'},
      {label:'TAKRAF — Special Tools',rows:db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity==='ST';}),col:'#b45309'},
    ];
  } else if(view==='ABB'){
    var s=commF==='ALL'?db.filter(function(r){return r.oem==='ABB';}):db.filter(function(r){return r.oem==='ABB'&&r.commodity===commF;});
    sections=[{label:'ABB — '+(commF==='ALL'?'All Spares':CN[commF]),rows:s,col:'#0066b3'}];
  } else if(view==='TAKRAF'){
    var s=commF==='ALL'?db.filter(function(r){return r.oem==='TAKRAF';}):db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity===commF;});
    sections=[{label:'TAKRAF — '+(commF==='ALL'?'All Spares':CN[commF]),rows:s,col:'#cc4400'}];
  } else if(view==='pres'){
    sections=[{label:'Preservation Register',rows:db.filter(function(r){return r.preservation==='Yes';}),col:'#b91c1c',pres:true}];
  } else if(view==='log'){
    sections=[{label:'Issue Log',rows:[...issLog].reverse(),col:'#1d4ed8',log:true}];
  }
  var body=sections.filter(function(s){return s.rows.length>0;}).map(function(s,si){
    var tbl='';
    if(s.log){
      tbl='<table><colgroup><col style="width:9%"><col style="width:5%"><col style="width:5%"><col style="width:8%"><col style="width:15%"><col style="width:6%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:10%"><col style="width:9%"><col style="width:13%"></colgroup>'+
        '<thead><tr><th>Date/Time</th><th>OEM</th><th>Tag</th><th>Part No.</th><th>Description</th><th>Bin</th><th>Issued</th><th>Before</th><th>After</th><th>Issued To</th><th>Work Order</th><th>Remarks</th></tr></thead><tbody>'+
        s.rows.map(function(l,i){return '<tr'+(i%2?' style="background:#f7f7f7"':'')+'>'+
          '<td>'+l.ts+'</td><td><b>'+l.oem+'</b></td><td><b>'+l.tag+'</b></td><td>'+(l.pn||'—')+'</td><td>'+l.desc+'</td><td>'+(l.bin||'—')+'</td>'+
          '<td style="text-align:right;color:#b91c1c;font-weight:700">-'+l.qtyIssued+'</td><td style="text-align:right">'+l.qtyBefore+'</td>'+
          '<td style="text-align:right;font-weight:700;color:'+(l.qtyAfter===0?'#b91c1c':'#047857')+'">'+l.qtyAfter+'</td>'+
          '<td>'+(l.issuedTo||'—')+'</td><td>'+(l.wo||'—')+'</td><td style="font-size:7pt">'+(l.remark||'—')+'</td></tr>';}).join('')+'</tbody></table>';
    } else if(s.pres){
      tbl='<table><colgroup><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:20%"><col style="width:9%"><col style="width:9%"><col style="width:6%"><col style="width:4%"><col style="width:9%"><col style="width:19%"></colgroup>'+
        '<thead><tr><th>OEM</th><th>Comm.</th><th>Tag</th><th>Description</th><th>System</th><th>Sub System</th><th>Bin</th><th>Qty</th><th>Supplier</th><th>Pres. Doc Ref.</th></tr></thead><tbody>'+
        s.rows.map(function(r,i){return '<tr'+(i%2?' style="background:#f7f7f7"':'')+'>'+
          '<td><b>'+(r.oem||'')+'</b></td><td><b>'+r.commodity+'</b></td><td>'+(r.tag||'')+'</td><td>'+(r.description||'')+'</td>'+
          '<td>'+(r.system||'—')+'</td><td>'+(r.subsystem||'—')+'</td><td style="color:#047857;font-weight:600">'+(r.bin||'—')+'</td>'+
          '<td style="text-align:right">'+(r.qty_stock||0)+'</td><td>'+(r.oem||r.manufacturer||'')+'</td>'+
          '<td style="color:#6d28d9">'+(r.presinterval||'TBD')+'</td></tr>';}).join('')+'</tbody></table>';
    } else {
      tbl='<table><colgroup><col style="width:7%"><col style="width:7%"><col style="width:5%"><col style="width:7%"><col style="width:17%"><col style="width:8%"><col style="width:8%"><col style="width:5%"><col style="width:4%"><col style="width:4%"><col style="width:7%"><col style="width:6%"><col style="width:8%"><col style="width:4%"><col style="width:3%"></colgroup>'+
        '<thead><tr><th>Shipment Ref</th><th>Packing List</th><th>Tag</th><th>Part Number</th><th>Description</th><th>System</th><th>Sub System</th><th>Bin</th><th>Qty</th><th>UOM</th><th>Supplier</th><th>Unit Cost</th><th>OEM Doc Ref</th><th>Location</th><th>Pres.</th></tr></thead><tbody>'+
        s.rows.map(function(r,i){
          var cost=r.cost?'£'+parseFloat(r.cost).toLocaleString(undefined,{maximumFractionDigits:0}):'—';
          var doc=r.presinterval||'';if(doc.indexOf('Per OEM Doc – ')===0)doc=doc.replace('Per OEM Doc – ','');
          return '<tr'+(i%2?' style="background:#f7f7f7"':'')+'>'+
            '<td style="color:#1e3a8a;font-weight:600">'+(r.shipment_ref||'—')+'</td>'+
            '<td style="color:#4c1d95;font-weight:600">'+(r.packing_list||'—')+'</td>'+
            '<td>'+(r.tag||'')+'</td><td>'+(r.pn||'—')+'</td><td>'+(r.description||'')+'</td>'+
            '<td>'+(r.system||'—')+'</td><td>'+(r.subsystem||'—')+'</td>'+
            '<td style="color:#047857;font-weight:600">'+(r.bin||'—')+'</td>'+
            '<td style="text-align:right;font-weight:700;color:'+((r.qty_stock||0)===0?'#b91c1c':'#000')+'">'+(r.qty_stock||0)+'</td>'+
            '<td>'+(r.unit||'')+'</td><td>'+(r.oem||r.manufacturer||'')+'</td><td style="text-align:right">'+cost+'</td>'+
            '<td style="font-size:7pt">'+doc.substring(0,18)+'</td><td>'+(r.location||'—').substring(0,10)+'</td>'+
            '<td style="color:'+( r.preservation==='Yes'?'#c0392b':'#888')+';font-weight:'+(r.preservation==='Yes'?700:400)+'">'+(r.preservation)+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    return (si>0?'<div style="page-break-before:always"></div>':'')+
      '<div style="background:'+s.col+';color:#fff;padding:5pt 10pt;margin-bottom:6pt;font-size:10pt;font-weight:700;border-radius:3pt;-webkit-print-color-adjust:exact;print-color-adjust:exact">'+s.label+' &nbsp;&middot;&nbsp; '+s.rows.length+(s.log?' transactions':' items')+'</div>'+tbl;
  }).join('');
  var total=sections.reduce(function(acc,s){return acc+s.rows.length;},0);
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+title+'</title>'+
    '<style>@page{size:A4 landscape;margin:10mm 8mm 8mm 8mm}*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:Arial,Helvetica,sans-serif;font-size:8.5pt;color:#000;background:#fff}'+
    '.hdr{background:#1a1a2e;color:#fff;padding:6pt 10pt;margin-bottom:8pt;display:flex;align-items:center;justify-content:space-between;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.ftr{border-top:0.5pt solid #ccc;margin-top:6pt;padding-top:3pt;font-size:6pt;color:#888;display:flex;justify-content:space-between}'+
    'table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-bottom:4pt;table-layout:fixed}'+
    'th{background:#1a1a2e;color:#fff;padding:3pt 4pt;text-align:left;border:0.5pt solid #555;font-size:7pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    'td{padding:2.5pt 4pt;border:0.5pt solid #ccc;vertical-align:top}'+
    'thead{display:table-header-group}tr{page-break-inside:avoid}</style></head><body>'+
    '<div class="hdr"><div><div style="font-size:14pt;font-weight:700;letter-spacing:2pt">RIO TINTO</div>'+
    '<div style="font-size:7pt;color:#aaa;margin-top:2pt">ICS DEPARTMENT  |  SIMANDOU PROJECT</div></div>'+
    '<div style="text-align:center;font-size:11pt;font-weight:700">'+title+'</div>'+
    '<div style="text-align:right;font-size:7pt;color:#aaa">Doc: RT-ICS-SPR-TAB-001<br>Date: '+dated+'<br>Total: '+total+' records</div></div>'+
    body+'<div class="ftr"><span>CONFIDENTIAL — RIO TINTO ICS DEPARTMENT — SIMANDOU PROJECT</span><span>Uncontrolled when printed</span></div></body></html>';
}
function exportCSV(){
  if(view==='log'){exportLogCSV();return;}
  var src=view==='pres'?db.filter(function(r){return r.preservation==='Yes';}):
    view==='ABB'?(commF==='ALL'?db.filter(function(r){return r.oem==='ABB';}):db.filter(function(r){return r.oem==='ABB'&&r.commodity===commF;})):
    view==='TAKRAF'?(commF==='ALL'?db.filter(function(r){return r.oem==='TAKRAF';}):db.filter(function(r){return r.oem==='TAKRAF'&&r.commodity===commF;})):
    (commF==='ALL'?db:db.filter(function(r){return r.commodity===commF;}));
  var h=['Shipment Ref','Packing List Ref','Tag','Part No','Description','Commodity','OEM','System','Sub System','Bin','Qty in Stock','Unit','Unit Cost','Lead Time','Location','Preservation','Pres. Interval','Notes','Added'];
  var rows=src.map(function(r){return [r.shipment_ref,r.packing_list,r.tag,r.pn,r.description,r.commodity,r.oem||r.manufacturer,r.system,r.subsystem,r.bin,r.qty_stock,r.unit,r.cost,r.leadtime,r.location,r.preservation,r.presinterval,r.notes,r.added].map(function(v){return '"'+((v===undefined||v===null?'':v).toString().replace(/"/g,'""'))+'"';}).join(',');});
  dl([h.join(',')].concat(rows).join('
'),'simandou_'+view+'_'+new Date().toISOString().split('T')[0]+'.csv');
}
function exportLogCSV(){
  var h=['Date/Time','OEM','Tag','Part No','Description','Bin','Qty Issued','Qty Before','Qty After','Issued To','Work Order','Remarks'];
  var rows=issLog.map(function(l){return [l.ts,l.oem,l.tag,l.pn,l.desc,l.bin,l.qtyIssued,l.qtyBefore,l.qtyAfter,l.issuedTo,l.wo,l.remark].map(function(v){return '"'+((v===undefined||v===null?'':v).toString().replace(/"/g,'""'))+'"';}).join(',');});
  dl([h.join(',')].concat(rows).join('
'),'simandou_issue_log_'+new Date().toISOString().split('T')[0]+'.csv');
}
function dl(csv,name){var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=name;a.click();}

document.getElementById('ov-edit').addEventListener('click',function(e){if(e.target===this)closeModals();});
document.getElementById('ov-issue').addEventListener('click',function(e){if(e.target===this)closeModals();});

render();
</script>
